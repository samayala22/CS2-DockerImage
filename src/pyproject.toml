[project]
name = "cs2-server-ops"
version = "0.1.0"
description = "Management scripts for the CS2 Docker image (plugin updates, configs, entrypoint)"
requires-python = ">=3.9"
dependencies = [
    "pyjson5>=1.6",
    "requests>=2.31",
]

# These are plain scripts run via `uv run <file>`, not an importable package.
[tool.uv]
package = false
